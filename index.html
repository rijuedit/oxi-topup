<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXI TOPUP - Free Fire Diamond Top Up</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        /* Multi Banner Slider Styling */
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 15px auto;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            aspect-ratio: 16 / 7;
            background: #1a1a1a;
        }
        .slider-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-in-out;
        }
        .slide {
            min-width: 100%;
            height: 100%;
            box-sizing: border-box;
            position: relative;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 16px;
            z-index: 10;
            transition: background 0.3s;
        }
        .slider-btn:hover { background: rgba(125, 95, 255, 0.8); }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }
        .slider-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }
        .dot.active {
            background: #7d5fff;
            width: 20px;
            border-radius: 4px;
        }
        .no-banners {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <a href="index.html">OXI <span>TOPUP</span></a>
        </div>
        <div class="user-actions" id="authNav">
            <a href="login.html" class="login-btn"><i class="fas fa-sign-in-alt"></i> লগইন</a>
        </div>
    </header>

    <main class="container">
        <!-- Banner Slider -->
        <div class="slider-container" id="bannerContainer">
            <div class="slider-wrapper" id="sliderWrapper">
                <div class="no-banners">লোডিং ব্যানার...</div>
            </div>
            <button class="slider-btn prev-btn" id="prevBtn" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></button>
            <button class="slider-btn next-btn" id="nextBtn" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></button>
            <div class="slider-dots" id="sliderDots"></div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="গেম বা প্যাক খুঁজুন..." oninput="filterProducts()">
        </div>

        <!-- Section Title -->
        <div class="section-title">
            <h2><i class="fas fa-fire" style="color:#ff4757;"></i> পপুলার ক্যাটাগরি</h2>
        </div>

        <!-- Products Grid -->
        <div class="product-grid" id="productGrid">
            <p style="grid-column: 1/-1; text-align:center; color:#888; padding:30px;">লোডিং হচ্ছে...</p>
        </div>
    </main>

    <!-- Bottom Navigation Bar for Mobile -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>হোম</span>
        </a>
        <a href="orders.html" class="nav-item">
            <i class="fas fa-shopping-bag"></i>
            <span>অর্ডারস</span>
        </a>
        <a href="add-money.html" class="nav-item">
            <i class="fas fa-wallet"></i>
            <span>এড মানি</span>
        </a>
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>প্রোফাইল</span>
        </a>
    </nav>
        <script type="module">
        import { auth, database, ref, onValue, get, checkIfBanned, signOut } from './config.js';

        let allProducts = {};
        let currentSlide = 0;
        let slideInterval;
        let totalSlides = 0;

        // Auth State Check
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const isBanned = await checkIfBanned(user.uid);
                if (isBanned) {
                    alert("আপনার অ্যাকাউন্টটি সাময়িকভাবে স্থগিত (Ban) করা হয়েছে।");
                    await signOut(auth);
                    window.location.href = 'login.html';
                    return;
                }

                const userSnap = await get(ref(database, 'users/' + user.uid));
                const userData = userSnap.val() || {};
                
                document.getElementById('authNav').innerHTML = `
                    <a href="dashboard.html" class="user-profile-btn">
                        <i class="fas fa-wallet" style="color:#2ecc71;"></i> 
                        <span>৳${userData.wallet || 0}</span>
                    </a>
                `;
            } else {
                document.getElementById('authNav').innerHTML = `
                    <a href="login.html" class="login-btn"><i class="fas fa-sign-in-alt"></i> লগইন</a>
                `;
            }
        });

        // Load Banners
        onValue(ref(database, 'banners'), (snapshot) => {
            const banners = snapshot.val() || {};
            renderBanners(banners);
        });

        function renderBanners(banners) {
            const wrapper = document.getElementById('sliderWrapper');
            const dotsContainer = document.getElementById('sliderDots');
            const keys = Object.keys(banners);
            
            totalSlides = keys.length;
            wrapper.innerHTML = '';
            dotsContainer.innerHTML = '';

            if (totalSlides === 0) {
                wrapper.innerHTML = '<div class="no-banners">কোন ব্যানার পাওয়া যায়নি</div>';
                document.getElementById('prevBtn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'none';
                return;
            }

            document.getElementById('prevBtn').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';

            keys.forEach((key, index) => {
                const b = banners[key];
                const slide = document.createElement('div');
                slide.className = 'slide';
                
                const img = document.createElement('img');
                img.src = b.image;
                img.alt = "Banner " + (index + 1);
                if (b.link) {
                    img.onclick = () => window.open(b.link, '_blank');
                }
                
                slide.appendChild(img);
                wrapper.appendChild(slide);

                const dot = document.createElement('div');
                dot.className = `dot ${index === 0 ? 'active' : ''}`;
                dot.onclick = () => goToSlide(index);
                dotsContainer.appendChild(dot);
            });

            currentSlide = 0;
            updateSlidePosition();
            startAutoSlide();
        }

        window.moveSlide = (step) => {
            if (totalSlides === 0) return;
            currentSlide = (currentSlide + step + totalSlides) % totalSlides;
            updateSlidePosition();
            resetAutoSlide();
        };

        window.goToSlide = (index) => {
            currentSlide = index;
            updateSlidePosition();
            resetAutoSlide();
        };

        function updateSlidePosition() {
            const wrapper = document.getElementById('sliderWrapper');
            wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if (index === currentSlide) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function startAutoSlide() {
            clearInterval(slideInterval);
            if (totalSlides > 1) {
                slideInterval = setInterval(() => {
                    moveSlide(1);
                }, 4000);
            }
        }

        function resetAutoSlide() {
            clearInterval(slideInterval);
            startAutoSlide();
        }

        // Load Products
        onValue(ref(database, 'products'), (snapshot) => {
            allProducts = snapshot.val() || {};
            renderProducts(allProducts);
        });

        window.renderProducts = (products) => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const keys = Object.keys(products);
            let activeCount = 0;

            keys.forEach(catId => {
                const cat = products[catId];
                if (cat.status === 'OFF') return;
                activeCount++;

                const card = document.createElement('div');
                card.className = 'product-card';
                
                // Safe URL Encoding for Special Characters like Apostrophe
                const safeCatId = encodeURIComponent(catId);
                card.onclick = () => window.location.href = `product.html?id=${safeCatId}`;

                card.innerHTML = `
                    <img src="${cat.image}" alt="${catId}" onerror="this.src='assets/placeholder.png'">
                    <div class="product-info">
                        <h3>${catId}</h3>
                        <p><i class="fas fa-bolt" style="color:#e1b12c;"></i> Instant Delivery</p>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (activeCount === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#888; padding:30px;">কোন ক্যাটাগরি পাওয়া যায়নি</p>';
            }
        };

        window.filterProducts = () => {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = {};

            Object.keys(allProducts).forEach(catId => {
                if (catId.toLowerCase().includes(query)) {
                    filtered[catId] = allProducts[catId];
                }
            });

            renderProducts(filtered);
        };
    </script>
</body>
</html>
