<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - OXI TOP UP</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/HTHSLY80/Chat-GPT-Image-Jul-22-2026-11-58-48-PM.png">
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .reject-reason-box {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.4);
            border-radius: 10px;
            padding: 12px 15px;
            margin-top: 10px;
            color: #ff6b6b;
            font-size: 13px;
        }
        .reject-reason-box strong {
            color: #ff6b6b !important;
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .reject-reason-box p {
            color: white !important;
            font-size: 13px;
            margin: 0;
        }
        .order-id-badge {
            background: linear-gradient(135deg, #8b00ff, #6a0dad);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            margin-right: 8px;
        }
    </style>
</head>
<body class="home-body">

    <nav class="home-navbar">
        <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
            <img src="https://i.ibb.co/HTHSLY80/Chat-GPT-Image-Jul-22-2026-11-58-48-PM.png" alt="OXI TOP UP" class="logo-img">
            <span style="font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;color:white;letter-spacing:1px;">OXI <span style="color:#8b00ff;">TOP UP</span></span>
        </a>
        <div class="home-nav-right">
            <a href="index.html" class="nav-link">Home</a>
            <div class="wallet-badge">
                <span>৳</span> <span id="walletBadge">0</span>
            </div>
            <img id="navPhoto" class="profile-icon-static" src="" alt="Profile" onclick="toggleSidebar()">
        </div>
    </nav>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <img id="sidebarPhoto" src="" alt="Profile">
            <div>
                <h4 id="sidebarName">User</h4>
                <p id="sidebarEmail">email@gmail.com</p>
            </div>
            <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="sidebar-menu">
            <a href="dashboard.html" class="sidebar-item"><span>🏠</span> My Account</a>
            <a href="orders.html" class="sidebar-item active"><span>📦</span> My Orders</a>
            <a href="transactions.html" class="sidebar-item"><span>💳</span> My Transaction</a>
            <a href="add-money.html" class="sidebar-item"><span>💰</span> Add Money</a>
            <a href="https://wa.me/8801604080312?text=Hello%20OXI%20TOP%20UP,%20I%20need%20help" target="_blank" class="sidebar-item"><span>💬</span> WhatsApp Support</a>
            <button class="sidebar-logout" id="logoutBtn">🚪 Logout</button>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="dash-container">
        <h2 class="page-title">📦 My Orders</h2>
        <div id="ordersList" class="orders-list">
            <p style="text-align:center;color:#888;padding:30px;">Loading...</p>
        </div>
    </div>

    <a href="https://wa.me/8801604080312?text=Hello%20OXI%20TOP%20UP,%20I%20need%20help" target="_blank" class="whatsapp-float">
        💬
        <span class="whatsapp-tooltip">Need Help? Chat Now!</span>
    </a>

    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="index.html" class="bottom-nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
            <a href="orders.html" class="bottom-nav-item active"><span class="nav-icon">📦</span><span>Orders</span></a>
            <a href="add-money.html" class="bottom-nav-item center"><span class="nav-icon">➕</span><span>Add</span></a>
            <a href="transactions.html" class="bottom-nav-item"><span class="nav-icon">💳</span><span>History</span></a>
            <a href="dashboard.html" class="bottom-nav-item"><span class="nav-icon">👤</span><span>Account</span></a>
        </div>
    </nav>

    <script type="module">
        import { auth, database, signOut, onAuthStateChanged, ref, get, checkIfBanned } from './config.js';

        window.toggleSidebar = function() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const banned = await checkIfBanned(user.uid);
            if (banned) {
                await signOut(auth);
                alert('🚫 Your account has been banned.');
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('navPhoto').src = user.photoURL;
            document.getElementById('sidebarPhoto').src = user.photoURL;
            document.getElementById('sidebarName').textContent = user.displayName;
            document.getElementById('sidebarEmail').textContent = user.email;

            const userRef = ref(database, 'users/' + user.uid);
            const snapshot = await get(userRef);
            if (snapshot.exists()) {
                document.getElementById('walletBadge').textContent = snapshot.val().wallet || 0;
            }

            // Load user's own orders only
            const ordersList = document.getElementById('ordersList');
            ordersList.innerHTML = '';

            try {
                const orderSnapshot = await get(ref(database, 'orders'));
                
                if (!orderSnapshot.exists()) {
                    ordersList.innerHTML = '<p style="text-align:center;color:#888;padding:30px;">You have no orders yet</p>';
                    return;
                }

                const orders = orderSnapshot.val();
                const myOrders = Object.entries(orders)
                    .filter(([id, ord]) => ord.userId === user.uid)
                    .sort((a, b) => new Date(b[1].orderDate) - new Date(a[1].orderDate));

                if (myOrders.length === 0) {
                    ordersList.innerHTML = '<p style="text-align:center;color:#888;padding:30px;">You have no orders yet</p>';
                    return;
                }

                myOrders.forEach(([id, ord]) => {
                    let statusColor = '#ffaa00';
                    if (ord.status === 'Complete') statusColor = '#00ff88';
                    else if (ord.status === 'Rejected' || ord.status === 'Failed') statusColor = '#ff6b6b';
                    
                    const date = new Date(ord.orderDate).toLocaleString('en-GB');
                    const orderIdDisplay = ord.orderNumber ? '#' + String(ord.orderNumber).padStart(3, '0') : id.substring(0, 10);

                    let rejectReasonHtml = '';
                    if ((ord.status === 'Rejected' || ord.status === 'Failed') && ord.rejectReason) {
                        rejectReasonHtml = `
                            <div class="reject-reason-box">
                                <strong>❌ Rejection Reason:</strong>
                                <p>${ord.rejectReason}</p>
                            </div>
                        `;
                    }

                    ordersList.innerHTML += `
                        <div class="order-card">
                            <div class="order-header">
                                <h4><span class="order-id-badge">${orderIdDisplay}</span>${ord.productName}</h4>
                                <span class="order-status" style="background:${statusColor}20;color:${statusColor};border:1px solid ${statusColor};">● ${ord.status}</span>
                            </div>
                            <div class="order-body">
                                <div class="order-row"><span>📦 Package:</span><strong>${ord.packageName}</strong></div>
                                <div class="order-row"><span>🆔 Player ID:</span><strong>${ord.playerId}</strong></div>
                                <div class="order-row"><span>💰 Price:</span><strong style="color:#8b00ff;">৳ ${ord.price}</strong></div>
                                <div class="order-row"><span>📅 Date:</span><strong>${date}</strong></div>
                                ${rejectReasonHtml}
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                ordersList.innerHTML = '<p style="text-align:center;color:red;padding:30px;">❌ Failed to load orders</p>';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });
    </script>

</body>
</html>
