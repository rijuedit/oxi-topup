<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OXI TOP UP</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/HTHSLY80/Chat-GPT-Image-Jul-22-2026-11-58-48-PM.png">
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="https://i.ibb.co/HTHSLY80/Chat-GPT-Image-Jul-22-2026-11-58-48-PM.png" alt="OXI TOP UP" class="login-logo-img">
                <p>Free Fire Diamond Top-Up</p>
            </div>

            <h2>👋 Welcome!</h2>

            <button id="googleLoginBtn" class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Sign in with Google
            </button>

            <div id="loadingDiv" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Login হচ্ছে...</p>
            </div>

            <div id="errorMsg" class="error-msg" style="display: none;"></div>

            <div class="divider">
                <span>Secure Login</span>
            </div>

            <p class="login-footer">
                Login করে আপনি আমাদের Terms & Conditions মেনে নিচ্ছেন
            </p>
        </div>
    </div>

    <script type="module">
        import { auth, database, googleProvider, signInWithPopup, signOut, ref, set, get, onAuthStateChanged, checkIfBanned } from './config.js';

        const googleBtn = document.getElementById('googleLoginBtn');
        const loadingDiv = document.getElementById('loadingDiv');
        const errorMsg = document.getElementById('errorMsg');

        function generateNumericId(uid) {
            let num = 0;
            for (let i = 0; i < uid.length; i++) {
                num += uid.charCodeAt(i) * (i + 1);
            }
            return String(100000 + (num % 900000));
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const banned = await checkIfBanned(user.uid);
                if (banned) {
                    await signOut(auth);
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = '🚫 Your account has been banned. Contact support.';
                    loadingDiv.style.display = 'none';
                    googleBtn.disabled = false;
                    return;
                }
                window.location.href = 'index.html';
            }
        });

        googleBtn.addEventListener('click', async () => {
            try {
                googleBtn.disabled = true;
                loadingDiv.style.display = 'block';
                errorMsg.style.display = 'none';

                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;

                // Check if banned first
                const banned = await checkIfBanned(user.uid);
                if (banned) {
                    await signOut(auth);
                    loadingDiv.style.display = 'none';
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = '🚫 Your account has been banned. Contact support.';
                    googleBtn.disabled = false;
                    return;
                }

                const userRef = ref(database, 'users/' + user.uid);
                const snapshot = await get(userRef);

                if (!snapshot.exists()) {
                    await set(userRef, {
                        name: user.displayName,
                        email: user.email,
                        photo: user.photoURL,
                        wallet: 0,
                        totalSpend: 0,
                        orders: 0,
                        numericId: generateNumericId(user.uid),
                        banned: false,
                        createdAt: new Date().toISOString(),
                        joinDate: new Date().toISOString()
                    });
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Login Error:', error);
                loadingDiv.style.display = 'none';
                errorMsg.style.display = 'block';
                errorMsg.textContent = '❌ Login ব্যর্থ: ' + error.message;
                googleBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
